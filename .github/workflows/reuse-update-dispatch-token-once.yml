name: 临时加密复用更新通知令牌
on:
  workflow_dispatch:
permissions: {}
jobs:
  seal:
    if: github.repository == 'ceastld/eaclip' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: 使用目标仓库公钥加密现有专用令牌
        env:
          EXISTING_DISPATCH_TOKEN: ${{ secrets.APP_UPDATES_DISPATCH_TOKEN }}
          TARGET_PUBLIC_KEY: xH1fIsNP1YbHnMr7YL/jBdI9MtEW3HEF13e0KgvjE1E=
          TARGET_KEY_ID: '3380204578043523366'
        run: |
          python3 - <<'PY'
          import base64, ctypes, ctypes.util, json, os, re
          from pathlib import Path
          secret = os.environ.pop('EXISTING_DISPATCH_TOKEN').encode('utf-8')
          if not re.fullmatch(rb'github_pat_[A-Za-z0-9_]+', secret):
              raise SystemExit('Existing dedicated fine-grained token is unavailable')
          library = ctypes.util.find_library('sodium')
          if not library:
              raise SystemExit('System libsodium is unavailable; no credential was exported')
          sodium = ctypes.CDLL(library)
          if sodium.sodium_init() < 0:
              raise SystemExit('libsodium initialization failed')
          sodium.crypto_box_sealbytes.restype = ctypes.c_size_t
          sodium.crypto_box_publickeybytes.restype = ctypes.c_size_t
          overhead = sodium.crypto_box_sealbytes()
          public_key = base64.b64decode(os.environ['TARGET_PUBLIC_KEY'], validate=True)
          if overhead != 48 or len(public_key) != sodium.crypto_box_publickeybytes():
              raise SystemExit('Invalid sealed-box parameters')
          byte = ctypes.c_ubyte
          sodium.crypto_box_seal.argtypes = [ctypes.POINTER(byte), ctypes.POINTER(byte), ctypes.c_ulonglong, ctypes.POINTER(byte)]
          sodium.crypto_box_seal.restype = ctypes.c_int
          plain = (byte * len(secret)).from_buffer_copy(secret)
          public = (byte * len(public_key)).from_buffer_copy(public_key)
          encrypted = (byte * (len(secret) + overhead))()
          if sodium.crypto_box_seal(encrypted, plain, len(secret), public) != 0:
              raise SystemExit('Credential encryption failed')
          folder = Path(os.environ['RUNNER_TEMP']) / 'reuse-update-token'
          folder.mkdir()
          (folder / 'sealed.json').write_text(json.dumps({
              'key_id': os.environ['TARGET_KEY_ID'],
              'encrypted_value': base64.b64encode(bytes(encrypted)).decode('ascii')
          }), encoding='utf-8')
          print('Prepared encrypted credential for ceastld/omnitrigger; no plaintext exported.')
          PY
      - name: 保存仅能由目标仓库解密的密文
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: omnitrigger-dispatch-token-sealed
          path: ${{ runner.temp }}/reuse-update-token/sealed.json
          if-no-files-found: error
          retention-days: 1
          compression-level: 0

