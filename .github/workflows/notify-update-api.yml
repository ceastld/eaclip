name: Notify update API

on:
  workflow_dispatch:
    inputs:
      release_tag:
        description: 'Existing published Rust release tag'
        required: true
        type: string
  workflow_call:
    inputs:
      release_tag:
        required: true
        type: string
    secrets:
      APP_UPDATES_DISPATCH_TOKEN:
        required: true
  release:
    types: [published]

permissions: {}

jobs:
  notify:
    if: github.event_name != 'release' || (!github.event.release.draft && !github.event.release.prerelease && startsWith(github.event.release.tag_name, 'rust-v'))
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    env:
      RELEASE_TAG: ${{ inputs.release_tag || github.event.release.tag_name }}
      DISPATCH_TOKEN: ${{ secrets.APP_UPDATES_DISPATCH_TOKEN }}
    steps:
      - name: Verify the published release and notify app-updates
        run: |
          python3 - <<'PY'
          import json, os, re
          from urllib.request import Request, urlopen
          tag = os.environ['RELEASE_TAG']
          if not re.fullmatch(r'rust-v(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)\.(?:0|[1-9][0-9]*)', tag):
              raise SystemExit('Expected a stable Rust release tag')
          token = os.environ.get('DISPATCH_TOKEN', '')
          if not token:
              raise SystemExit('Configure APP_UPDATES_DISPATCH_TOKEN with Contents: write permission on ceastld/app-updates')
          repository = 'ceastld/eaclip'
          headers = {'User-Agent': 'eaclip-release-notification', 'Accept': 'application/vnd.github+json'}
          with urlopen(Request(f'https://api.github.com/repos/{repository}/releases/tags/{tag}', headers=headers), timeout=30) as response:
              release = json.load(response)
          if (release['draft'] or release['prerelease'] or release['tag_name'] != tag or
              release['html_url'] != f'https://github.com/{repository}/releases/tag/{tag}'):
              raise SystemExit('Only an existing public stable eaclip Release may notify the update API')
          stem = f'eaclip-{tag.removeprefix("rust-v")}-windows-x64'
          for suffix in ('.zip', '.build-info.json', '.SHA256SUMS.txt'):
              assets = [a for a in release['assets'] if a['name'] == stem + suffix and a['state'] == 'uploaded' and a['size'] > 0]
              if len(assets) != 1:
                  raise SystemExit('Release assets are incomplete')
          payload = {'event_type': 'release-published', 'client_payload': {'product': 'eaclip', 'repository': repository, 'tag': tag}}
          headers.update({'Authorization': 'Bearer ' + token, 'Content-Type': 'application/json', 'X-GitHub-Api-Version': '2022-11-28'})
          request = Request('https://api.github.com/repos/ceastld/app-updates/dispatches', data=json.dumps(payload).encode(), headers=headers, method='POST')
          with urlopen(request, timeout=30) as response:
              if response.status != 204:
                  raise SystemExit('Release notification was not accepted')
          print(f'Notified app-updates: {tag}')
          PY

