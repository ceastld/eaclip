[package]
name = "cliphost-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "ClipHost Tauri desktop host (coexists with C# IntelliTools.ClipHost)"

[features]
# Standalone cargo builds can open the bundled SPA without a running Vite server.
# Debug builds still prefer Vite when resolve_frontend_dev_base finds it.
default = ["custom-protocol"]
custom-protocol = ["tauri/custom-protocol"]
native-acceptance = ["cliphost-core/native-acceptance", "windows/Win32_Graphics_Dwm"]

[lib]
name = "cliphost_app_lib"
crate-type = ["rlib"]

[[bin]]
name = "cliphost-app"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
cliphost-core = { workspace = true }
cliphost-http = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
image = { workspace = true }
url = { workspace = true }
tauri = { version = "2", features = ["tray-icon"] }
tauri-plugin-single-instance = "2"
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
windows = { workspace = true }

[target.'cfg(windows)'.dependencies]
# Match Tauri/Wry's native WebView2 interface ABI; core Win32 code stays on 0.58.
webview2-com = "0.38"
windows-core = "0.61"
windows61 = { package = "windows", version = "0.61", features = ["Win32_Foundation", "Win32_System_Com"] }

[dev-dependencies]
tempfile = { workspace = true }
