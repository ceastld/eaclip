[package]
name = "cliphost-updater"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Verified, in-place ClipHost Rust update download and rollback helper"

[features]
test-support = []

[[bin]]
name = "cliphost-update-fixture"
path = "src/bin/fixture.rs"
required-features = ["test-support"]

[dependencies]
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
uuid.workspace = true
url.workspace = true
reqwest = { version = "0.13.5", default-features = false, features = ["blocking", "json", "rustls-no-provider"] }
rustls.workspace = true
zip = { version = "2.4.2", default-features = false, features = ["deflate"] }

[target.'cfg(windows)'.dependencies]
windows = { workspace = true, features = ["Win32_System_Threading", "Win32_System_ProcessStatus"] }

[dev-dependencies]
tempfile.workspace = true
